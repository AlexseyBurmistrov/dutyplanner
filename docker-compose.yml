version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: duty_planner_db
    environment:
      POSTGRES_DB: duty_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - duty_planner_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: node:18-alpine
    container_name: duty_planner_backend
    working_dir: /app
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=duty_planner
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    networks:
      - duty_planner_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: |
      sh -c "
        npm install &&
        node server.js
      "

  # Frontend
  frontend:
    image: nginx:alpine
    container_name: duty_planner_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - duty_planner_network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  duty_planner_network:
    driver: bridge